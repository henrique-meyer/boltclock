name: pr

on:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bicep
        run: |
          curl -fsSL -o bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep

      # The example parameter file must stay in step with the template. Placeholder secrets only.
      - name: Build Bicep and the example parameters
        env:
          GOOGLE_MAPS_API_KEY: ci-placeholder
          NWS_USER_AGENT: "(BoltClock CI, ci@example.com)"
        run: |
          bicep build infra/main.bicep --stdout > /dev/null
          cp infra/main.bicepparam.example infra/ci.bicepparam
          bicep build-params infra/ci.bicepparam --stdout > /dev/null

      # The AWS relay (ADR 0004) is CloudFormation; lint it without AWS credentials.
      - name: Lint the CloudFormation relay
        run: pipx run cfn-lint infra/aws/relay.yaml

      - uses: docker/setup-buildx-action@v4
        if: hashFiles('Dockerfile') != ''

      - uses: docker/build-push-action@v7
        if: hashFiles('Dockerfile') != ''
        with:
          context: .
          push: false
          load: true
          tags: boltclock:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must start as a non-root process on 8080 and answer /health.
      - name: Run the image and check /health
        if: hashFiles('Dockerfile') != ''
        run: |
          docker run --detach --name boltclock --publish 8080:8080 boltclock:pr
          trap 'docker logs boltclock; docker rm --force boltclock > /dev/null' EXIT
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors http://localhost:8080/health
          test "$(docker exec boltclock id -u)" != "0"
